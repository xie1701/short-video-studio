<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0" />
<title>SVS V11 30fps Motion Stage</title>
<style>
  @font-face {
    font-family: "SVS-Sans";
    src: url("./fonts/AlimamaShuHeiTi-Bold.otf") format("opentype");
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: "SVS-Serif-Heavy";
    src: url("./fonts/SourceHanSerifCN-Heavy.otf") format("opentype");
    font-weight: 900;
    font-display: block;
  }
  @font-face {
    font-family: "SVS-Serif-Bold";
    src: url("./fonts/SourceHanSerifCN-Bold.otf") format("opentype");
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: "SVS-Oblique";
    src: url("./fonts/SmileySans-Oblique.ttf") format("truetype");
    font-weight: 600;
    font-display: block;
  }
  @font-face {
    font-family: "SVS-Hand";
    src: url("./fonts/MaShanZheng-Regular.ttf") format("truetype");
    font-weight: 400;
    font-display: block;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: transparent;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }
  #stage {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
  }

  .font-sans { font-family: "SVS-Sans", "SVS-Serif-Heavy", "PingFang SC", sans-serif; }
  .font-serif { font-family: "SVS-Serif-Heavy", "SVS-Serif-Bold", "Songti SC", serif; }
  .font-serif-bold { font-family: "SVS-Serif-Bold", "SVS-Serif-Heavy", "Songti SC", serif; }
  .font-oblique { font-family: "SVS-Oblique", "SVS-Sans", sans-serif; }
  .font-hand { font-family: "SVS-Hand", "SVS-Serif-Bold", cursive; }

  /* 细腻炭墨底与纸质纹理底 */
  .bg-charcoal {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 760px 920px at 50% 42%, rgba(44, 49, 64, 0.52) 0%, rgba(20, 22, 30, 0.0) 70%),
      linear-gradient(180deg, #171922 0%, #12141b 55%, #171922 100%);
  }
  .bg-guofeng {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 740px 840px at 50% 34%, rgba(68, 52, 34, 0.42) 0%, rgba(20, 17, 15, 0) 72%),
      linear-gradient(180deg, #191614 0%, #12100e 60%, #171412 100%);
  }
  .bg-paper {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 900px 1000px at 50% 35%, #fcfbf7 0%, #f1efe8 68%, #e5e2d9 100%);
  }
  .bg-magazine {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 960px 1060px at 50% 38%, #f4f6f9 0%, #e4e9f0 70%, #d7dfe8 100%);
  }
  .paper-grain {
    position: absolute; inset: 0;
    opacity: 0.09;
    background-image:
      repeating-linear-gradient(0deg, rgba(20, 20, 24, 0.22) 0px, rgba(20, 20, 24, 0.22) 1px, transparent 1px, transparent 4px),
      repeating-linear-gradient(90deg, rgba(20, 20, 24, 0.14) 0px, rgba(20, 20, 24, 0.14) 1px, transparent 1px, transparent 6px);
  }
  .bottom-sub-band {
    position: absolute;
    left: 0; right: 0; bottom: 0; height: 675px;
    background: linear-gradient(180deg, rgba(18, 20, 28, 0) 0%, rgba(18, 20, 28, 0.90) 14%, rgba(15, 17, 24, 0.98) 38%, #10121a 100%);
  }

  /* 通用描边文字辅助 */
  .stroke-heavy {
    -webkit-text-stroke: 8px #0c0d12;
    paint-order: stroke fill;
    text-shadow: 0 8px 20px rgba(0, 0, 0, 0.65);
  }
  .stroke-mid {
    -webkit-text-stroke: 5px #0c0d12;
    paint-order: stroke fill;
    text-shadow: 0 6px 14px rgba(0, 0, 0, 0.58);
  }
  .stroke-blue {
    -webkit-text-stroke: 11px #183a88;
    paint-order: stroke fill;
    text-shadow: 0 8px 18px rgba(10, 22, 58, 0.50);
  }
  .stroke-white {
    -webkit-text-stroke: 6px #ffffff;
    paint-order: stroke fill;
    text-shadow: 0 6px 16px rgba(0, 0, 0, 0.55);
  }
  .glow-gold {
    text-shadow: 0 0 28px rgba(244, 214, 128, 0.55), 0 4px 12px rgba(0, 0, 0, 0.72);
  }
  .glow-white {
    text-shadow: 0 0 26px rgba(255, 255, 255, 0.52), 0 6px 16px rgba(0, 0, 0, 0.78);
  }
</style>
</head>
<body>
<div id="stage"></div>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const jobFile = params.get("job") || "job.json";
  let cfg = {};
  try {
    const res = await fetch("./" + jobFile);
    cfg = await res.json();
  } catch (e) {
    cfg = { kind: "typewriter_quote", dur: 2.5, title: "核心真相", lines: ["先找底层前提", "再谈方法落地"] };
  }

  const DUR = Math.max(0.4, Number(cfg.dur || 2.8));
  const STAGE = document.getElementById("stage");
  window.__SVS_STAGE_META = { width: 1080, height: 1920, fps: Number(cfg.fps || 30), duration: DUR };
  window.DUR = DUR;

  // ── 确定性缓动函数（纯函数，绝无 CSS transition / requestAnimationFrame 状态泄漏）──
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const lerp = (a, b, t) => a + (b - a) * clamp(t);
  const easeOutCubic = (x) => 1 - Math.pow(1 - clamp(x), 3);
  const easeOutExpo = (x) => (clamp(x) >= 1 ? 1 : 1 - Math.pow(2, -10 * clamp(x)));
  const easeOutBack = (x, s = 1.65) => {
    const t = clamp(x) - 1;
    return 1 + (s + 1) * t * t * t + s * t * t;
  };
  const prog = (t, t0, span) => clamp((t - t0) / Math.max(0.001, span));
  const esc = (s) => String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const fontClass = (role) => {
    const r = String(role || cfg.font_role || "sans");
    if (r === "serif") return "font-serif";
    if (r === "serif_bold") return "font-serif-bold";
    if (r === "oblique") return "font-oblique";
    if (r === "hand") return "font-hand";
    return "font-sans";
  };

  // 构建各模板 DOM 骨架，并返回纯函数 updater(t)
  function buildScene() {
    const kind = String(cfg.kind || "typewriter_quote");
    const variant = String(cfg.variant || "");
    const title = String(cfg.title || "").trim();
    const subtitle = String(cfg.subtitle || "").trim();
    const lines = Array.isArray(cfg.lines) && cfg.lines.length ? cfg.lines.map(String) : [title || "核心要点"];
    const items = Array.isArray(cfg.items) ? cfg.items : [];
    const accent = String(cfg.accent || "#FFE14D");
    const accent2 = String(cfg.accent2 || "#EF4444");
    const fg = String(cfg.fg || "#F8FAFC");
    const opaque = cfg.opaque !== false;
    const fCls = fontClass(cfg.font_role);
    const outFadeStart = Math.max(DUR - 0.16, DUR * 0.92);

    // ════════════════════════════════════════════════════════════════════════
    // 1) 真 30fps 逐字打字机引语卡（style_03 / 14 / 16 / 18 / 20）
    // ════════════════════════════════════════════════════════════════════════
    if (kind === "typewriter_quote") {
      const isBlurOverlay = !opaque || variant === "s16_blur_dark_typewriter" || variant === "s18_blur_white_strip";
      const isStrip = variant === "s18_blur_white_strip";
      const bgHtml = isBlurOverlay ? "" : `<div class="${variant.startsWith("s20") ? "bg-guofeng" : "bg-charcoal"}"></div>`;
      if (isStrip) {
        // style_18: 虚化暗底左侧大白序号 + 白色圆角暗红引号条动态滑出+逐字显现
        STAGE.innerHTML = `
          ${bgHtml}
          <div id="tw-wrap" style="position:absolute;left:96px;top:490px;width:888px;">
            <div id="tw-ord" class="font-serif stroke-mid" style="font-size:84px;color:#FFFFFF;letter-spacing:4px;margin-bottom:26px;opacity:0;">${esc(title || "核心洞察")}</div>
            <div id="tw-pill" style="display:inline-block;max-width:860px;background:rgba(252,252,254,0.96);border-left:10px solid ${accent2};border-radius:14px;padding:24px 36px;box-shadow:0 18px 42px rgba(0,0,0,0.45);transform-origin:left center;opacity:0;">
              <div id="tw-body" class="font-sans" style="font-size:52px;line-height:1.38;color:#B91C1C;letter-spacing:1px;"></div>
            </div>
          </div>`;
        const fullTxt = "“" + lines.join("，").slice(0, 26) + "”";
        const ordEl = document.getElementById("tw-ord");
        const pillEl = document.getElementById("tw-pill");
        const bodyEl = document.getElementById("tw-body");
        return (t) => {
          const p0 = easeOutBack(prog(t, 0.02, 0.34));
          ordEl.style.opacity = clamp(prog(t, 0.02, 0.24));
          ordEl.style.transform = `translateY(${lerp(36, 0, p0)}px)`;
          const p1 = easeOutExpo(prog(t, 0.16, 0.40));
          pillEl.style.opacity = clamp(prog(t, 0.16, 0.22));
          pillEl.style.transform = `scaleX(${lerp(0.25, 1, p1)}) translateX(${lerp(-28, 0, p1)}px)`;
          const tp = prog(t, 0.24, Math.min(1.5, DUR * 0.58));
          const n = Math.max(1, Math.round(fullTxt.length * tp));
          const blink = Math.floor(t * 2.8) % 2 === 0 ? 1 : 0.12;
          bodyEl.innerHTML = `${esc(fullTxt.slice(0, n))}<span style="display:inline-block;width:6px;height:46px;background:${accent2};margin-left:8px;vertical-align:-6px;opacity:${blink};"></span>`;
        };
      }

      // 标准电影感逐行逐字打字机（复刻 style_16 / 03 / 14 / 20）
      const isLeftAlign = variant === "s16_blur_dark_typewriter" || variant === "s03_black_typewriter";
      const topY = variant === "s03_black_typewriter" ? 450 : 410;
      const citation = String(cfg.citation || (subtitle ? `—— ${subtitle}` : "")).trim();
      const dispLines = lines.slice(0, 5).map((s, i) => (i === 0 ? "“" + s : s));
      if (dispLines.length) dispLines[dispLines.length - 1] += "”";
      const totalChars = dispLines.reduce((a, b) => a + b.length, 0);

      STAGE.innerHTML = `
        ${bgHtml}
        <div id="tw-box" style="position:absolute;left:98px;top:${topY}px;width:884px;text-align:${isLeftAlign ? "left" : "center"};">
          <div id="tw-accent-bar" style="width:76px;height:6px;border-radius:4px;background:${accent};margin:${isLeftAlign ? "0 0 34px 0" : "0 auto 34px auto"};transform-origin:left center;"></div>
          <div id="tw-lines" class="${fCls}" style="font-size:${totalChars > 32 ? 48 : 56}px;line-height:1.58;color:${fg};letter-spacing:2px;text-shadow:0 6px 20px rgba(0,0,0,0.72);"></div>
          <div id="tw-cite" class="font-serif-bold" style="margin-top:42px;font-size:38px;color:${accent};letter-spacing:3px;text-align:right;opacity:0;">${esc(citation)}</div>
        </div>`;

      const barEl = document.getElementById("tw-accent-bar");
      const linesEl = document.getElementById("tw-lines");
      const citeEl = document.getElementById("tw-cite");
      const typeEnd = Math.min(DUR * 0.62, Math.max(1.2, totalChars * 0.045));
      const initChars = Math.min(totalChars, Math.max(4, Math.round(totalChars * 0.16)));

      return (t) => {
        const bp = easeOutExpo(prog(t, 0.0, 0.28));
        barEl.style.transform = `scaleX(${Math.max(0.25, bp)})`;
        barEl.style.opacity = Math.max(0.55, clamp(prog(t, 0.0, 0.18)));

        const tp = prog(t, 0.02, Math.max(0.5, typeEnd - 0.02));
        let rem = Math.max(initChars, Math.round(initChars + (totalChars - initChars) * tp));
        const blink = Math.floor(t * 2.6) % 2 === 0 ? 0.96 : 0.08;
        const cursorSpan = `<span style="display:inline-block;width:24px;height:${totalChars > 32 ? 44 : 52}px;background:#FFFFFF;margin-left:8px;vertical-align:-8px;border-radius:3px;opacity:${blink};box-shadow:0 0 14px rgba(255,255,255,0.65);"></span>`;
        let html = "";
        let placedCursor = false;
        for (let i = 0; i < dispLines.length; i++) {
          const ln = dispLines[i];
          if (rem <= 0) break;
          const take = Math.min(ln.length, rem);
          rem -= take;
          const isLastShown = rem <= 0 || i === dispLines.length - 1;
          const curStr = isLastShown && !placedCursor ? ((placedCursor = true), cursorSpan) : "";
          html += `<div style="margin-bottom:14px;">${esc(ln.slice(0, take))}${curStr}</div>`;
        }
        linesEl.innerHTML = html;

        if (citation) {
          const cp = easeOutCubic(prog(t, typeEnd * 0.85, 0.42));
          citeEl.style.opacity = cp;
          citeEl.style.transform = `translateY(${lerp(22, 0, cp)}px)`;
        }
      };
    }

    // ════════════════════════════════════════════════════════════════════════
    // 2) style_15 原母本真魂：米白纸底大纲清单白板（左上圆窗 + 英文拼音副标 + 逐条条目）
    // ════════════════════════════════════════════════════════════════════════
    if (kind === "paper_outline_whiteboard") {
      const pySub = String(cfg.pinyin_sub || subtitle || "CORE FRAMEWORK").toUpperCase();
      const bullets = items.length
        ? items.slice(0, 4)
        : lines.slice(0, 3).map((ln, i) => ({
            ord: ["一、", "二、", "三、", "四、"][i] || `${i + 1}、`,
            text: ln,
            tag: "",
          }));
      const cx = Number(cfg.circle_cx || 184);
      const cy = Number(cfg.circle_cy || 216);
      const cr = Number(cfg.circle_r || 106);

      STAGE.innerHTML = `
        <div class="bg-paper"></div>
        <div class="paper-grain"></div>
        <!-- 左上角主播圆形小窗细框（留洞交由 FFmpeg 叠实拍圆窗） -->
        <div id="po-ring" style="position:absolute;left:${cx - cr - 8}px;top:${cy - cr - 8}px;width:${(cr + 8) * 2}px;height:${(cr + 8) * 2}px;border-radius:50%;border:5px solid #262932;box-shadow:0 12px 32px rgba(0,0,0,0.16);opacity:0;"></div>
        <!-- 顶部纸张页眉装饰线 -->
        <div id="po-head" style="position:absolute;left:72px;top:368px;width:936px;text-align:center;opacity:0;">
          <div class="font-sans" style="font-size:${(title || "").length >= 8 ? 64 : 82}px;color:#181A20;letter-spacing:4px;line-height:1.15;">${esc(title || "核心三要素")}</div>
          <div class="font-sans" style="margin-top:16px;font-size:28px;color:#646B7A;letter-spacing:5px;font-weight:700;">${esc(pySub)}</div>
          <div id="po-rule" style="margin:26px auto 0 auto;width:360px;height:4px;background:linear-gradient(90deg,transparent,#1E222B,transparent);transform-origin:center;"></div>
        </div>
        <!-- 逐条展开的大纲条目区 -->
        <div id="po-list" style="position:absolute;left:108px;top:620px;width:864px;">
          ${bullets
            .map(
              (b, idx) => `
            <div id="po-item-${idx}" style="margin-bottom:44px;padding:28px 34px;border-radius:18px;background:rgba(255,255,255,0.82);border:2px solid rgba(24,26,32,0.10);box-shadow:0 10px 26px rgba(24,26,32,0.06);opacity:0;">
              <div style="display:flex;align-items:baseline;gap:14px;">
                <span class="font-serif" style="font-size:50px;color:#C88A16;flex-shrink:0;">${esc(b.ord || `${idx + 1}、`)}</span>
                <span class="font-sans" style="font-size:50px;color:#181A20;line-height:1.35;letter-spacing:1px;">${esc(b.text || b)}</span>
              </div>
              ${b.sub ? `<div class="font-serif-bold" style="margin-top:12px;margin-left:78px;font-size:34px;color:#525866;">${esc(b.sub)}</div>` : ""}
            </div>`
            )
            .join("")}
        </div>
        <!-- 底部深暗过渡带保证底部白色常规字幕高对比度 -->
        <div class="bottom-sub-band"></div>`;

      const ringEl = document.getElementById("po-ring");
      const headEl = document.getElementById("po-head");
      const ruleEl = document.getElementById("po-rule");
      const itemEls = bullets.map((_, idx) => document.getElementById(`po-item-${idx}`));
      const stagger = Math.min(0.55, (DUR * 0.56) / Math.max(1, bullets.length));

      return (t) => {
        const rp = easeOutBack(prog(t, 0.0, 0.35));
        ringEl.style.opacity = clamp(prog(t, 0.0, 0.25));
        ringEl.style.transform = `scale(${lerp(0.75, 1, rp)})`;

        const hp = easeOutCubic(prog(t, 0.04, 0.38));
        headEl.style.opacity = hp;
        headEl.style.transform = `translateY(${lerp(28, 0, hp)}px)`;
        ruleEl.style.transform = `scaleX(${easeOutExpo(prog(t, 0.14, 0.42))})`;

        itemEls.forEach((el, idx) => {
          const t0 = 0.22 + idx * stagger;
          const ip = easeOutBack(prog(t, t0, 0.42), 1.25);
          el.style.opacity = clamp(prog(t, t0, 0.24));
          el.style.transform = `translateX(${lerp(-44, 0, ip)}px)`;
          // 当前读到的条目高亮微描边
          const active = t >= t0 && (idx === itemEls.length - 1 || t < t0 + stagger * 1.15);
          el.style.borderColor = active ? "rgba(200,138,22,0.75)" : "rgba(24,26,32,0.10)";
        });
      };
    }

    // ════════════════════════════════════════════════════════════════════════
    // 3) style_24 原母本真魂：浅灰杂志纸底多图测评白板
    // ════════════════════════════════════════════════════════════════════════
    if (kind === "magazine_review_whiteboard") {
      const cards = items.length ? items.slice(0, 3) : lines.slice(0, 2).map((ln) => ({ text: ln, badge: "重点" }));
      STAGE.innerHTML = `
        <div class="bg-magazine"></div>
        <div class="paper-grain"></div>
        <!-- 顶部黄蓝斜体冲击大标题 -->
        <div id="mr-title" class="font-oblique stroke-blue" style="position:absolute;left:60px;top:148px;width:960px;text-align:center;font-size:112px;color:#FFE033;letter-spacing:4px;opacity:0;">${esc(title || "实测痛点")}</div>
        <!-- 中央圆角实拍/主播视频卡槽装饰框（实拍内容由 FFmpeg 嵌在 110,316 尺寸 860x500） -->
        <div id="mr-slot" style="position:absolute;left:104px;top:310px;width:872px;height:512px;border-radius:32px;border:6px solid #FFFFFF;box-shadow:0 22px 48px rgba(15,23,42,0.22);background:rgba(15,23,42,0.06);opacity:0;"></div>
        <!-- 下方带图标徽章的要点/痛点测评卡片 -->
        <div style="position:absolute;left:96px;top:866px;width:888px;">
          ${cards
            .map(
              (c, idx) => `
            <div id="mr-card-${idx}" style="display:flex;align-items:center;gap:26px;margin-bottom:28px;padding:24px 32px;border-radius:24px;background:rgba(255,255,255,0.96);border:3px solid #D4DCE8;box-shadow:0 12px 28px rgba(15,23,42,0.10);opacity:0;">
              <div style="width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,#F59E0B,#EA580C);display:flex;align-items:center;justify-content:center;color:#FFFFFF;font-size:38px;font-weight:900;flex-shrink:0;box-shadow:0 6px 14px rgba(234,88,12,0.35);" class="font-sans">${idx + 1}</div>
              <div class="font-oblique" style="font-size:52px;color:#1E293B;line-height:1.25;letter-spacing:1px;">${esc(c.text || c)}</div>
            </div>`
            )
            .join("")}
        </div>
        <div class="bottom-sub-band"></div>`;

      const tEl = document.getElementById("mr-title");
      const sEl = document.getElementById("mr-slot");
      const cEls = cards.map((_, i) => document.getElementById(`mr-card-${i}`));
      return (t) => {
        const tp = easeOutBack(prog(t, 0.0, 0.36), 1.8);
        tEl.style.opacity = clamp(prog(t, 0.0, 0.20));
        tEl.style.transform = `scale(${lerp(0.65, 1, tp)}) translateY(${lerp(-24, 0, tp)}px)`;

        const sp = easeOutCubic(prog(t, 0.08, 0.34));
        sEl.style.opacity = sp;
        sEl.style.transform = `scale(${lerp(0.94, 1, sp)})`;

        cEls.forEach((el, i) => {
          const t0 = 0.24 + i * 0.36;
          const cp = easeOutBack(prog(t, t0, 0.38), 1.35);
          el.style.opacity = clamp(prog(t, t0, 0.22));
          el.style.transform = `translateY(${lerp(42, 0, cp)}px) scale(${lerp(0.92, 1, cp)})`;
        });
      };
    }

    // ════════════════════════════════════════════════════════════════════════
    // 4) style_09 / 19 / 22 纪实纯黑双区面板（左下柔圆主播 + 上半区引号高亮/卷宗/证据框）
    // ════════════════════════════════════════════════════════════════════════
    if (kind === "doc_evidence_panel") {
      const cx = Number(cfg.circle_cx || 205);
      const cy = Number(cfg.circle_cy || 1085);
      const cr = Number(cfg.circle_r || 114);
      const isRedQuote = variant === "bottom_left_red_quote";
      const isYellowQuote = variant === "bottom_left_yellow_quote";
      const isDossier = variant === "bottom_left_dossier";
      const isEvidenceFrame = variant === "bottom_left_doc" && Boolean(cfg.has_sec);

      let topHtml = "";
      if (isEvidenceFrame) {
        topHtml = `
          <div id="doc-frame" style="position:absolute;left:76px;top:248px;width:928px;height:534px;border:4px solid #CCA966;border-radius:10px;box-shadow:0 18px 46px rgba(0,0,0,0.55);opacity:0;">

          <div id="doc-card" style="position:absolute;left:128px;top:220px;width:824px;min-height:560px;background:#F6F4EE;border-radius:14px;padding:44px 48px;box-shadow:0 24px 60px rgba(0,0,0,0.65);border-top:12px solid #B91C1C;opacity:0;">

        ringEl.style.transform = `scale(${lerp(0.76, 1, rp)})`;

        const tp = easeOutCubic(prog(t, 0.10, 0.36));
        tagEl.style.opacity = tp;
        tagEl.style.transform = `translateX(${lerp(-24, 0, tp)}px)`;
        ulEl.style.transform = `scaleX(${easeOutExpo(prog(t, 0.16, 0.46))})`;

        if (frameEl) {
          const fp = easeOutCubic(prog(t, 0.04, 0.36));
          frameEl.style.opacity = fp;
          frameEl.style.transform = `scale(${lerp(0.95, 1, fp)})`;

              ${(rightObj.points || []).slice(0, 3).map((p) => `<div class="font-sans" style="font-size:36px;color:${bodyColor};line-height:1.42;margin-bottom:20px;">· ${esc(p)}</div>`).join("")}

                <div class="font-sans" style="width:80px;height:80px;border-radius:18px;background:${i === rows.length - 1 ? accent : accent2};color:${i === rows.length - 1 ? accentInk : accent2Ink};display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;flex-shrink:0;">${esc(r.ord || `0${i + 1}`)}</div>
                <div>
                  <div class="font-sans" style="font-size:46px;color:${bodyColor};line-height:1.28;">${esc(r.label || r.text || r)}</div>
                  ${r.desc ? `<div class="font-serif-bold" style="margin-top:8px;font-size:32px;color:${subColor};">${esc(r.desc)}</div>` : ""}
                </div>
              </div>
              ${mode === "chain" && i < rows.length - 1 ? `<div id="dg-arr-${i}" style="text-align:center;font-size:38px;color:${accent};margin:-6px 0 12px 0;opacity:0;">▼</div>` : ""}`
              )
              .join("")}
          </div>`;
      }

      STAGE.innerHTML = `
        <div class="${bgCls}"></div>
        ${lightTheme ? '<div class="paper-grain"></div>' : ""}
        ${showCircle ? `<div id="dg-ring" style="position:absolute;left:${cx - cr - 6}px;top:${cy - cr - 6}px;width:${(cr + 6) * 2}px;height:${(cr + 6) * 2}px;border-radius:50%;border:5px solid ${accent};opacity:0;"></div>` : ""}
        <div style="position:absolute;left:76px;top:${showCircle ? 330 : 260}px;width:928px;">
          <div id="dg-kicker" class="font-sans" style="display:inline-block;padding:8px 22px;border-radius:8px;background:${accent2};color:${accent2Ink};font-size:30px;letter-spacing:3px;opacity:0;">${esc(subtitle || "核心结构拆解")}</div>
          <div id="dg-title" class="${fCls}" style="margin-top:20px;font-size:74px;color:${headColor};letter-spacing:3px;line-height:1.2;opacity:0;">${esc(title || "本质拆解")}</div>
          ${bodyHtml}
        </div>
        ${lightTheme ? '<div class="bottom-sub-band"></div>' : ""}`;

      const ringEl = document.getElementById("dg-ring");
      const kEl = document.getElementById("dg-kicker");
      const tEl = document.getElementById("dg-title");
      const cEls = [0, 1, 2].map((i) => document.getElementById(`dg-c${i}`)).filter(Boolean);
      const aEls = [0, 1].map((i) => document.getElementById(`dg-arr-${i}`)).filter(Boolean);

      return (t) => {
        if (ringEl) ringEl.style.opacity = clamp(prog(t, 0.0, 0.25));
        const kp = easeOutCubic(prog(t, 0.02, 0.30));
        kEl.style.opacity = kp;
        kEl.style.transform = `translateX(${lerp(-28, 0, kp)}px)`;

        const tp = easeOutBack(prog(t, 0.08, 0.36), 1.25);
        tEl.style.opacity = clamp(prog(t, 0.08, 0.22));
        tEl.style.transform = `translateY(${lerp(24, 0, tp)}px)`;

        const step = Math.min(0.42, (DUR * 0.50) / Math.max(1, cEls.length));
        cEls.forEach((el, i) => {
          const t0 = 0.20 + i * step;
          const p = easeOutBack(prog(t, t0, 0.40), 1.3);
          el.style.opacity = clamp(prog(t, t0, 0.22));
          el.style.transform = `translateY(${lerp(40, 0, p)}px) scale(${lerp(0.92, 1, p)})`;
        });
        aEls.forEach((el, i) => {
          el.style.opacity = clamp(prog(t, 0.38 + i * step, 0.22));
        });
      };
    }

    // ════════════════════════════════════════════════════════════════════════
    // 8) 全透明 30fps 动态前景花字（覆盖全部常规镜头的高潮砸屏/气泡/诗句/竖排大黄字）
    // ════════════════════════════════════════════════════════════════════════
    if (kind === "kinetic_callout") {
      // 全部走透明底（--alpha），直接叠在实拍口播视频上
      if (variant === "s24_vertical_yellow") {
        // style_24 左侧竖排黑边大黄手写字（复刻原片 28.4s「耗油」）
        const chars = Array.from((title || "重磅").slice(0, 4));
        STAGE.innerHTML = `
          <div style="position:absolute;left:78px;top:310px;display:flex;flex-direction:column;gap:8px;">
            ${chars
              .map(
                (ch, i) => `<div id="kc-v-${i}" class="font-oblique stroke-heavy" style="font-size:132px;line-height:1.06;color:#FFE135;opacity:0;">${esc(ch)}</div>`
              )
              .join("")}
          </div>`;
        const els = chars.map((_, i) => document.getElementById(`kc-v-${i}`));
        return (t) => {
          const outA = 1 - clamp(prog(t, outFadeStart, DUR - outFadeStart));
          els.forEach((el, i) => {
            const p = easeOutBack(prog(t, i * 0.14, 0.34), 2.0);
            el.style.opacity = clamp(prog(t, i * 0.14, 0.16)) * outA;
            el.style.transform = `scale(${lerp(1.55, 1, p)}) rotate(${lerp(-14, -4, p)}deg)`;
          });
        };
      }

      if (variant === "s22_floating_tags") {
        // style_22 悬浮白色概念卡片（复刻原片 18.3s「城市 / 院校 / 专业」）
        const tags = (items.length ? items : lines).slice(0, 3).map((x) => String(x.text || x).slice(0, 6));
        const slots = [
          { x: 112, y: 840, rot: -3 },
          { x: 420, y: 740, rot: 2 },
          { x: 690, y: 860, rot: -2 },
        ];
        STAGE.innerHTML = tags
          .map(
            (tg, i) => `
          <div id="kc-tg-${i}" class="font-serif-bold" style="position:absolute;left:${slots[i].x}px;top:${slots[i].y}px;background:rgba(255,255,255,0.96);color:#1E293B;font-size:48px;padding:18px 34px;border-radius:14px;box-shadow:0 16px 36px rgba(0,0,0,0.34);border-bottom:6px solid #DC2626;opacity:0;">${esc(tg)}</div>`
          )
          .join("");
        const els = tags.map((_, i) => document.getElementById(`kc-tg-${i}`));
        return (t) => {
          const outA = 1 - clamp(prog(t, outFadeStart, DUR - outFadeStart));
          els.forEach((el, i) => {
            const t0 = i * 0.22;
            const p = easeOutBack(prog(t, t0, 0.38), 1.85);
            const bob = Math.sin(t * 2.8 + i * 1.7) * 6;
            el.style.opacity = clamp(prog(t, t0, 0.18)) * outA;
            el.style.transform = `translateY(${lerp(56, 0, p) + bob}px) scale(${lerp(0.65, 1, p)}) rotate(${slots[i].rot}deg)`;
          });
        };
      }

      if (variant === "s12_pill_bubbles") {
        // style_12 黑白胶囊信息小标签气泡（复刻原片 17.1s「关键信息 / 音效」）
        const pills = (items.length ? items : lines).slice(0, 2).map((x) => String(x.text || x).slice(0, 6));
        STAGE.innerHTML = `
          <div id="kc-p0" class="font-sans" style="position:absolute;left:92px;top:980px;background:rgba(15,17,22,0.92);color:#FFFFFF;font-size:38px;padding:14px 30px;border-radius:999px;border:3px solid rgba(255,255,255,0.35);box-shadow:0 12px 26px rgba(0,0,0,0.4);opacity:0;">${esc(pills[0] || title)}</div>
          ${pills[1] ? `<div id="kc-p1" class="font-sans" style="position:absolute;right:96px;top:860px;background:rgba(255,255,255,0.95);color:#111318;font-size:38px;padding:14px 30px;border-radius:999px;box-shadow:0 12px 26px rgba(0,0,0,0.35);opacity:0;">${esc(pills[1])}</div>` : ""}`;
        const p0 = document.getElementById("kc-p0");
        const p1 = document.getElementById("kc-p1");
        return (t) => {
          const outA = 1 - clamp(prog(t, outFadeStart, DUR - outFadeStart));
          const a0 = easeOutBack(prog(t, 0.04, 0.34), 2.1);
          p0.style.opacity = clamp(prog(t, 0.04, 0.16)) * outA;
          p0.style.transform = `scale(${lerp(0.3, 1, a0)}) translateY(${Math.sin(t * 3.0) * 5}px)`;
          if (p1) {
            const a1 = easeOutBack(prog(t, 0.24, 0.34), 2.1);
            p1.style.opacity = clamp(prog(t, 0.24, 0.16)) * outA;
            p1.style.transform = `scale(${lerp(0.3, 1, a1)}) translateY(${Math.cos(t * 3.0) * 5}px)`;
          }
        };
      }

      if (variant === "s06_vertical_poem") {
        // style_06 尾段右侧竖排诗意暖金宋体（复刻原片 19.5s）
        const txt = (title || lines[0] || "行稳致远").slice(0, 9);
        STAGE.innerHTML = `
          <div id="kc-vp" class="font-serif-bold glow-gold" style="position:absolute;right:94px;top:360px;writing-mode:vertical-rl;font-size:58px;letter-spacing:14px;color:#F4E2A8;opacity:0;">${esc(txt)}</div>`;
        const el = document.getElementById("kc-vp");
        return (t) => {
          const outA = 1 - clamp(prog(t, outFadeStart, DUR - outFadeStart));
          const p = easeOutCubic(prog(t, 0.06, 0.55));
          el.style.opacity = p * outA;
          el.style.transform = `translateY(${lerp(-36, 0, p)}px)`;
        };
      }

      if (variant === "s21_lime_arrow") {
        // style_21 头顶荧光黄绿超大粗字 + 红色动态手绘箭头/下划线
        STAGE.innerHTML = `
          <div style="position:absolute;left:70px;top:240px;width:940px;text-align:center;">
            <div id="kc-t" class="font-sans stroke-heavy" style="font-size:108px;color:#D9F94D;letter-spacing:4px;opacity:0;">${esc(title.slice(0, 7))}</div>
            <svg width="560" height="44" viewBox="0 0 560 44" style="display:block;margin:8px auto 0 auto;overflow:visible;">
              <path id="kc-path" d="M 20 26 Q 280 4 540 22" fill="none" stroke="#EF4444" stroke-width="11" stroke-linecap="round" stroke-dasharray="560" stroke-dashoffset="560"/>
            </svg>
          </div>`;
        const tEl = document.getElementById("kc-t");
        const pEl = document.getElementById("kc-path");
        return (t) => {
          const outA = 1 - clamp(prog(t, outFadeStart, DUR - outFadeStart));
          const p = easeOutBack(prog(t, 0.0, 0.34), 1.9);
          tEl.style.opacity = clamp(prog(t, 0.0, 0.16)) * outA;
          tEl.style.transform = `scale(${lerp(0.62, 1, p)})`;
          const sp = easeOutExpo(prog(t, 0.18, 0.45));
          pEl.setAttribute("stroke-dashoffset", String(Math.round(560 * (1 - sp))));
          pEl.style.opacity = String(outA);
        };
      }

      if (variant === "s20_crimson_plate") {
        // style_20 国风胸口暗红发光底块白字重点（复刻原片 1.2s/16.0s/27.6s）
        STAGE.innerHTML = `
          <div id="kc-cp" style="position:absolute;left:50%;top:1030px;transform:translateX(-50%);background:linear-gradient(90deg,rgba(153,27,27,0.92),rgba(185,28,28,0.96),rgba(153,27,27,0.92));padding:20px 54px;border-radius:10px;border:2px solid rgba(243,211,122,0.55);box-shadow:0 12px 34px rgba(153,27,27,0.55);opacity:0;">
            <div class="font-serif" style="font-size:66px;color:#FFFDF7;letter-spacing:6px;white-space:nowrap;">${esc(title.slice(0, 9))}</div>
          </div>`;
        const el = document.getElementById("kc-cp");
        return (t) => {
          const outA = 1 - clamp(prog(t, outFadeStart, DUR - outFadeStart));
          const p = easeOutExpo(prog(t, 0.02, 0.34));
          el.style.opacity = clamp(prog(t, 0.02, 0.18)) * outA;
          el.style.transform = `translateX(-50%) scaleX(${lerp(0.55, 1, p)}) scaleY(${lerp(0.88, 1, p)})`;
        };
      }

      // 通用满屏/胸口动态大花字砸屏（涵盖 s05 胸口暗红/白大字、s06 胸口发光暖金、s08 满屏白大字、s15 胸口发光白大字等）
      const yPos = Number(cfg.y || 960);
      const isGlowWhite = variant === "s15_glow_white" || variant === "s16_glow_white";
      const isWarmGold = variant === "s06_warm_gold";
      const isS05Red = variant === "s05_crimson_3d";
      const isFullWhite = variant === "s08_giant_white";
      const fs = isFullWhite ? 124 : isS05Red ? 112 : isGlowWhite ? 118 : 96;
      const color = isS05Red ? "#C92A2A" : isWarmGold ? "#F4E2A8" : isFullWhite || isGlowWhite ? "#FFFFFF" : accent;
      const extraCls = isS05Red ? "stroke-white" : isWarmGold ? "glow-gold stroke-mid" : isGlowWhite ? "glow-white stroke-mid" : "stroke-heavy";
      const l1 = lines[0] || title;
      const l2 = lines[1] || "";

      STAGE.innerHTML = `
        <div id="kc-box" style="position:absolute;left:48px;top:${yPos}px;width:984px;text-align:center;opacity:0;">
          <div id="kc-l1" class="${fCls} ${extraCls}" style="font-size:${l1.length >= 7 ? Math.round(fs * 0.82) : fs}px;color:${color};letter-spacing:5px;line-height:1.18;">${esc(l1.slice(0, 9))}</div>
          ${l2 ? `<div id="kc-l2" class="${fCls} ${extraCls}" style="margin-top:14px;font-size:${Math.round(fs * 0.86)}px;color:${accent};letter-spacing:4px;line-height:1.18;opacity:0;">${esc(l2.slice(0, 9))}</div>` : ""}
        </div>`;
      const boxEl = document.getElementById("kc-box");
      const l2El = document.getElementById("kc-l2");
      return (t) => {
        const outA = 1 - clamp(prog(t, outFadeStart, DUR - outFadeStart));
        const p = easeOutBack(prog(t, 0.0, 0.30), 2.1);
        // 前 0.18s 带极微妙砸屏冲击震动
        const shakeX = t < 0.18 ? Math.sin(t * 75) * (1 - t / 0.18) * 10 : 0;
        const shakeY = t < 0.18 ? Math.cos(t * 68) * (1 - t / 0.18) * 6 : 0;
        boxEl.style.opacity = clamp(prog(t, 0.0, 0.12)) * outA;
        boxEl.style.transform = `translate(${shakeX.toFixed(1)}px, ${(lerp(28, 0, p) + shakeY).toFixed(1)}px) scale(${lerp(1.42, 1.0, p)})`;
        if (l2El) {
          const p2 = easeOutBack(prog(t, 0.16, 0.32), 1.6);
          l2El.style.opacity = clamp(prog(t, 0.16, 0.18)) * outA;
          l2El.style.transform = `translateY(${lerp(24, 0, p2)}px) scale(${lerp(0.82, 1, p2)})`;
        }
      };
    }

    return () => {};
  }

  const update = buildScene();
  // 电影级持续氛围流光与呼吸微推（仅对不透明动态面板生效，让 0..DUR 全程每秒保持细腻真实动效、彻底消除后半段死静与冻帧）
  let ambientLayer = null;
  let sweepBar = null;
  if (cfg.opaque !== false && String(cfg.kind || "") !== "kinetic_callout") {
    ambientLayer = document.createElement("div");
    ambientLayer.style.cssText = "position:absolute;inset:0;pointer-events:none;z-index:99;overflow:hidden;";
    const isLightBg = Boolean(cfg.light_theme) || String(cfg.kind || "") === "paper_outline_whiteboard" || String(cfg.kind || "") === "magazine_review_whiteboard";
    const glowA = isLightBg ? "rgba(217,119,6,0.18)" : "rgba(255,225,77,0.30)";
    const glowB = isLightBg ? "rgba(37,99,235,0.14)" : "rgba(220,38,38,0.26)";
    ambientLayer.innerHTML = `
      <div id="amb-orb-1" style="position:absolute;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,${glowA},transparent 64%);filter:blur(28px);"></div>
      <div id="amb-orb-2" style="position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,${glowB},transparent 66%);filter:blur(30px);"></div>
      <div id="amb-sweep" style="position:absolute;left:-20%;width:140%;height:380px;background:linear-gradient(180deg,transparent,${isLightBg ? "rgba(15,23,42,0.12)" : "rgba(255,255,255,0.16)"},transparent);transform:rotate(-8deg);"></div>
    `;
    STAGE.appendChild(ambientLayer);
    sweepBar = ambientLayer.querySelector("#amb-sweep");
  }
  const orb1 = ambientLayer ? ambientLayer.querySelector("#amb-orb-1") : null;
  const orb2 = ambientLayer ? ambientLayer.querySelector("#amb-orb-2") : null;

  window.seek = (t) => {
    const tc = Math.max(0, Math.min(DUR, Number(t || 0)));
    update(tc);
    if (ambientLayer && orb1 && orb2 && sweepBar) {
      const u = DUR > 0.01 ? tc / DUR : 0;
      // 双光晕绕屏匀速柔和巡航 + 斜向流光缓慢扫屏（每 0.5s 产生清晰可见光学位移，电影感十足且 0 冻帧）
      const x1 = -160 + 780 * Math.sin(u * Math.PI * 2.2 + 0.3);
      const y1 = 80 + 960 * Math.abs(Math.sin(u * Math.PI * 1.4));
      const x2 = 480 - 680 * Math.cos(u * Math.PI * 2.0);
      const y2 = 1320 - 880 * Math.abs(Math.cos(u * Math.PI * 1.3));
      orb1.style.transform = `translate(${x1.toFixed(1)}px, ${y1.toFixed(1)}px)`;
      orb2.style.transform = `translate(${x2.toFixed(1)}px, ${y2.toFixed(1)}px)`;
      const sy = -340 + (1920 + 680) * ((tc * 0.42) % 1.0);
      sweepBar.style.top = `${sy.toFixed(1)}px`;
    }
  };
  try {
    await document.fonts.ready;
  } catch {}
  window.seek(0);
  window.READY = true;
})();
</script>
</body>
</html>
